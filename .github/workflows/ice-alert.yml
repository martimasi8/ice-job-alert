name: ICE Job Alert

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  check-ice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run ICE checker
        run: |
          python ice_alert.py
